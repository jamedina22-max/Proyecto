<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banca 360 | Iniciar Sesión</title>
    <link rel="stylesheet" href="/Styles/stylesinicio.css">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <div class="logo">
                <h2>Banca<span> 360</span></h2>
            </div>
            <p class="welcome-text">Bienvenido de nuevo. Por favor, ingresa tus credenciales.</p>
            
            <form action="#">
                <div class="input-group">
                    <label for="username">Usuario o Tarjeta</label>
                    <input type="text" id="username" placeholder="Ingresa tu usuario" required>
                </div>
                
                <div class="input-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" placeholder="••••••••" required minlength="6">
                </div>
                
                <div class="icono-ocultar">
                    <img id="icono-ocultar" src="Assets/ocultaroscuro.png" alt="Mostrar/Ocultar contraseña" style="width: 28px; height: 28px;" />
                </div>

                <div class="options">
                    <label><input type="checkbox"> Recordar usuario</label>
                    <a href="#" class="forgot-link">¿Olvidaste tu clave?</a>
                </div>
                
                <button type="submit" class="login-btn">Entrar de forma segura</button>
            </form>

            <div class="register-prompt">
                <p>¿No tienes cuenta? <a href="Registrar.html">Regístrate aquí</a></p>
            </div>

            <div class="security-notice">
                <p><strong>Aviso de seguridad:</strong> Nunca compartas tu clave con terceros. Nosotros no te la pediremos por teléfono ni correo.</p>
            </div>
        </div>
    </div>

    <!-- Modal de recuperación de cuenta -->
    <div id="recuperacion-modal">
        <div class="modal-content" id="recuperacion-content">
            <!-- El contenido se llena dinámicamente -->
        </div>
    </div>

    <!--Spinner de carga-->
    <div id="spinner-overlay" style="display:none;">
        <div class="spinner"></div>
    </div>


    <!-- Script externo para manejar la lógica de la página -->
    <script src="/Scripts/Scriptinicio.js"></script>

</body>
</html>
