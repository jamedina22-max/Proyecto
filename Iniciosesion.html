<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banca Nueva | Iniciar Sesión</title>
    <link rel="stylesheet" href="stylesinicio.css">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <div class="logo">
                <h2>Banca<span> Nueva</span></h2>
            </div>
            <p class="welcome-text">Bienvenido de nuevo. Por favor, ingresa tus credenciales.</p>
            
            <form action="#">
                <div class="input-group">
                    <label for="username">Usuario o Tarjeta</label>
                    <input type="text" id="username" placeholder="Ingresa tu usuario" required>
                </div>
                
                <div class="input-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>
                
                <div class="options">
                    <label><input type="checkbox"> Recordar usuario</label>
                    <a href="#" class="forgot-link">¿Olvidaste tu clave?</a>
                </div>
                
                <button type="submit" class="login-btn">Entrar de forma segura</button>
            </form>

            <div class="security-notice">
                <p><strong>Aviso de seguridad:</strong> Nunca compartas tu clave con terceros. Nosotros no te la pediremos por teléfono ni correo.</p>
            </div>
        </div>
    </div>
</body>
</html>
