<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Cuenta | Banca Nueva</title>
    <link rel="stylesheet" href="dashboard.css">
</head>
<body>
    <div class="dashboard-container">
        <header class="top-bar">
            <div class="logo-small">Banca<span>Nueva</span></div>
            <button class="logout-btn">Cerrar Sesión</button>
        </header>

        <main class="content">
            <section class="balance-card">
                <p class="balance-label">Saldo Disponible</p>
                <h1 class="balance-amount">$ 12,450.00</h1>
                <p class="account-number">Cuenta Corriente **** 4589</p>
            </section>

            <h3 class="section-title">Operaciones</h3>
            <div class="actions-grid">
                <button class="action-card">
                    <span>Transferencias</span>
                </button>
                
                <button class="action-card">
                    <span>Pago Móvil</span>
                </button>
                
                <button class="action-card">
                    <span>Recargas</span>
                </button>
                
                <button class="action-card">
                    <span>Movimientos</span>
                </button>
            </div>
        </main>
    </div>
</body>
</html>
