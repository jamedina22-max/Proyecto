<html></html><!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pago Movil | Banca 360</title>
    <link rel="stylesheet" href="../Styles/Pagomovil.css">
</head>
<body>
    <div class="dashboard-container">
        <header class="top-bar">
            <div class="logo-small">Banca<span> 360</span></div>
        </header>
        <main class="content">
            <h2>Pago Movil</h2>
            <form id="form-otrosbancos" autocomplete="off">
                <div class="input-group">
                    <label for="cuenta-debitar"></label>
                    <select id="cuenta-debitar" required></select>
                </div>
                <div class="input-group">
                    <label for="banco"></label>
                    <select id="banco" required>
                        <option value="">Seleccione un banco</option>
                        <option value="Mercantil">Mercantil</option>
                        <option value="Banesco">Banesco</option>
                        <option value="Banco de Venezuela">Banco de Venezuela</option>
                        <option value="Bancaribe">Bancaribe</option>
                    </select>
                </div>
                <div class="input-group">
                    <label for="Numero"></label>
                    <input type="number" id="Numero" placeholder="Numero Telefonico " min="1">
                </div>
                
                <div class="input-group" style="display:flex; align-items:center; gap:10px;">
                    <label for="tipo">Tipo:</label>
                    <select id="tipo" required>
                        <option value="G">G</option>
                        <option value="J">J</option>
                        <option value="E">E</option>
                        <option value="V">V</option>
                    </select>
                    <label for="documento" style="margin-left:10px;"></label>
                    <input type="number" id="documento" placeholder="Documento:" min="01">
                </div>
                <div class="input-group">
                    <label for="monto"></label>
                    <input type="number" id="monto" placeholder="Monto:" min="0.01" step="0.01" required>
                </div>
                <div class="input-group">
                    <label for="concepto"></label>
                    <input type="text" id="concepto" placeholder="Concepto:" required>
                </div>
                <div class="input-group" style="color:red; margin-bottom:10px;">
                    <span id="saldo-error"></span>
                </div>
                <div class="input-group" style="display:flex; gap:10px;">
                    <button id="limpiar-btn">Limpiar</button>
                    <button id="transferir-btn">Transferir</button>
                    <button id="regresar-btn" type="button">Regresar</button>
                </div>
            </form>
        </main>
    </div>
   
</body>
</html>
