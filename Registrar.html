<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Registro | Banca Nueva</title>
        <link rel="stylesheet" href="stylesregistro.css">
    </head>
    <body>
        <div class="register-container">
            <div class="register-box">
                <div class="logo">
                    <h2>Banca<span> Nueva</span></h2>
                </div>
                <p class="welcome-text">Regístrate para crear tu cuenta.</p>
                <form action="#">
                    <div class="input-group">
                        <label for="fullname">Nombre completo</label>
                        <input type="text" id="fullname" placeholder="Ingresa tu nombre completo" required>
                    </div>
                    <div class="input-group">
                        <label for="username">Usuario</label>
                        <input type="text" id="username" placeholder="Elige un nombre de usuario" required>
                    </div>
                    <div class="input-group">
                        <label for="email">Correo electrónico</label>
                        <input type="email" id="email" placeholder="Ingresa tu correo electrónico" required>
                    </div>
                    <div class="input-group">
                        <label for="phone">Número de teléfono</label>
                        <input type="tel" id="phone" placeholder="Ingresa tu número de teléfono" required>
                    </div>
                    <div class="input-group">
                        <label for="password">Contraseña</label>
                        <input type="password" id="password" placeholder="••••••••" required minlength="6">
                    </div>
                    <div class="input-group">
                        <label for="confirm-password">Confirmar contraseña</label>
                        <input type="password" id="confirm-password" placeholder="••••••••" required>
                    </div>
                    <button type="submit" class="register-btn">Crear cuenta</button>
                </form>
            </div>
        </div>
        <!-- Cuadro oculto para preguntas de seguridad -->
        <div id="security-questions-modal">
        <div class="modal-content">
            <h3>Crear Preguntas de seguridad</h3>
            <form id="security-questions-form">
            <div>
                <label>Pregunta 1</label>
                <select required>
                <option value="">Selecciona una pregunta</option>
                <option>¿Cuál es el nombre de tu primera mascota?</option>
                <option>¿En qué ciudad naciste?</option>
                <option>¿Cuál es tu comida favorita?</option>
                </select>
                <input type="text" placeholder="Respuesta" required>
            </div>
            <div>
                <label>Pregunta 2</label>
                <select required>
                <option value="">Selecciona una pregunta</option>
                <option>¿Cuál es el nombre de tu mejor amigo de la infancia?</option>
                <option>¿Cuál es tu color favorito?</option>
                <option>¿Cómo se llama tu madre?</option>
                </select>
                <input type="text" placeholder="Respuesta" required>
            </div>
            <div>
                <label>Pregunta 3</label>
                <select required>
                <option value="">Selecciona una pregunta</option>
                <option>¿Cuál es tu película favorita?</option>
                <option>¿Cuál es el nombre de tu primer colegio?</option>
                <option>¿Cómo se llama tu padre?</option>
                </select>
                <input type="text" placeholder="Respuesta" required>
            </div>
            <button type="submit">Guardar respuestas</button>
            </form>
        </div>
        </div>

        <!-- Script para manejar el registro y almacenamiento de datos -->
        <script>
            const registroForm = document.querySelector('.register-box form');
            const preguntasForm = document.getElementById('security-questions-form');
            const modal = document.getElementById('security-questions-modal');

            // Validación y mostrar modal
            registroForm.addEventListener('submit', function(e) {
                e.preventDefault();
                const password = document.getElementById('password').value;
                const confirm = document.getElementById('confirm-password').value;
                if (password.length < 6) {
                    alert('La contraseña debe tener al menos 6 caracteres.');
                    return;
                }
                if (password !== confirm) {
                    alert('Las contraseñas no coinciden.');
                    return;
                }
                // Mostrar modal de preguntas
                modal.style.display = 'flex';
            });

            // Guardar datos y redirigir
            preguntasForm.addEventListener('submit', function(e) {
                e.preventDefault();
                // Datos principales
                const userData = {
                    fullname: document.getElementById('fullname').value,
                    username: document.getElementById('username').value,
                    email: document.getElementById('email').value,
                    phone: document.getElementById('phone').value,
                    password: document.getElementById('password').value,
                    questions: []
                };
                // Preguntas y respuestas
                const selects = preguntasForm.querySelectorAll('select');
                const inputs = preguntasForm.querySelectorAll('input[type="text"]');
                for (let i = 0; i < 3; i++) {
                    userData.questions.push({
                        question: selects[i].value,
                        answer: inputs[i].value
                    });
                }
                // Guardar en localStorage (por username)
                localStorage.setItem('user_' + userData.username, JSON.stringify(userData));
                // Redirigir a Iniciosesion.html
                window.location.href = 'Iniciosesion.html';
            });
        </script>
        
    </body>
</html>
